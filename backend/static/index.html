    from { opacity: 0; transform: translateY(40px) rotateX(-90deg); }
    to { opacity: 1; transform: translateY(0) rotateX(0); }

  .anim-letter {
    display: inline-block;
    opacity: 0;
    animation: letterIn 0.6s cubic-bezier(.2,.7,.2,1) forwards;

  .card-in {

  @keyframes pulse-glow {

  @keyframes dotPulse {

  @keyframes slideIn {

const { useState, useEffect, useRef } = React;

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || 'GET',
    headers: { 'content-type': 'application/json', ...(options.headers || {}) },
    body: options.body,
    credentials: 'same-origin',
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error((data && data.detail) || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return data;
}

  </svg>

function AuthShell({ icon, title, subtitle, children }) {
  return (
    <div style={{ minHeight: 'calc(100vh - 64px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div style={{ width: '100%', maxWidth: 440, animation: 'fadeUp 0.5s ease forwards' }}>

          <div style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 56, height: 56, background: 'var(--surface2)', borderRadius: 16, marginBottom: 20, boxShadow: '0 0 30px var(--accent-glow)' }}>
            <Icon d={icon} size={24} stroke="var(--accent)" />
          </div>
          <h1 style={{ fontSize: 28, fontWeight: 700, marginBottom: 8, letterSpacing: '-0.03em', fontFamily: 'var(--display)' }}>{title}</h1>
          {subtitle && <p style={{ color: 'var(--text2)', fontSize: 15, lineHeight: 1.5 }}>{subtitle}</p>}
        </div>
        {children}
      </div>
    </div>
  );
}

function ErrorMsg({ children }) {
  if (!children) return null;
  return (
    <div style={{ padding: '10px 14px', borderRadius: 8, background: 'oklch(60% 0.2 25 / 0.1)', border: '1px solid oklch(60% 0.2 25 / 0.3)', color: 'var(--red)', fontSize: 13 }}>
      {children}
    </div>
  );
}

function TextField({ icon, type = 'text', placeholder, value, onChange, autoFocus, autoComplete }) {
  const [focused, setFocused] = useState(false);
  return (
    <div style={{ position: 'relative', display: 'flex', alignItems: 'center', background: 'var(--surface)', border: `1px solid ${focused ? 'var(--accent)' : 'var(--border2)'}`, borderRadius: 12, transition: 'border-color 0.2s, box-shadow 0.2s', boxShadow: focused ? '0 0 0 3px var(--accent-glow)' : 'none' }}>
      {icon && <div style={{ padding: '0 14px', color: 'var(--text3)' }}><Icon d={icon} size={16} /></div>}
      <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
        autoFocus={autoFocus} autoComplete={autoComplete}
        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        style={{ flex: 1, background: 'none', border: 'none', outline: 'none', color: 'var(--text)', fontFamily: 'var(--font)', fontSize: 15, padding: '14px 16px', paddingLeft: icon ? 0 : 16 }} />
    </div>
  );
}


function AuthPage({ token, onSuccess, setPage }) {
  const [email, setEmail] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [sent, setSent] = useState(false);
  const [confirmState, setConfirmState] = useState(token ? 'confirming' : 'idle');

  useEffect(() => {
    if (!token) return;
    api('/api/login/confirm', { method: 'POST', body: JSON.stringify({ token }) })
      .then(() => { setConfirmState('ok'); setTimeout(() => onSuccess?.(), 800); })
      .catch(err => { setConfirmState('fail'); setError(err.message || 'Ссылка устарела или уже использована'); });
  }, [token]);

  if (token && confirmState === 'confirming') {
    return (
      <AuthShell icon={Icons.lock} title="Входим..." subtitle="Секунду">
        <div style={{ textAlign: 'center', padding: 20 }}><Spinner /></div>
      </AuthShell>
    );
  }
  if (token && confirmState === 'ok') {
    return (
      <AuthShell icon={Icons.checkCircle} title="Готово" subtitle="Открываем кабинет...">
        <div style={{ textAlign: 'center', padding: 20, color: 'var(--green)' }}>
          <Icon d={Icons.check} size={40} stroke="var(--green)" strokeWidth={3} />
        </div>
      </AuthShell>
    );
  }
  if (token && confirmState === 'fail') {
    return (
      <AuthShell icon={Icons.alertTriangle} title="Не удалось войти" subtitle="Возможно, ссылка устарела или уже использована.">
        <ErrorMsg>{error}</ErrorMsg>
        <button onClick={() => { window.history.replaceState(null, '', '/auth'); setPage('auth'); window.location.reload(); }} style={{ ...appStyles.btnSecondary, width: '100%', justifyContent: 'center', padding: '12px', marginTop: 16 }}>
          Запросить новую ссылку
        </button>
      </AuthShell>
    );
  }

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    setLoading(true);
    try {
      await api('/api/login/request', { method: 'POST', body: JSON.stringify({ email }) });
      setSent(true);
    } catch (err) {
      setError(err.message || 'Не удалось отправить письмо');
    } finally {
      setLoading(false);
    }
  };

  if (sent) {
    return (
      <AuthShell icon={Icons.mail} title="Проверьте почту"
        subtitle={<>Мы отправили ссылку на <strong style={{ color: 'var(--text)' }}>{email}</strong>. Перейдите по ней, чтобы войти. Ссылка действует 30 минут.</>}>
        <div style={{ padding: '14px 16px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 12, fontSize: 13, color: 'var(--text2)', lineHeight: 1.5, marginBottom: 18 }}>
          Если письма нет в течение пары минут — проверьте папку «Спам».
        </div>
        <button onClick={() => { setSent(false); setEmail(''); }} style={{ ...appStyles.btnSecondary, width: '100%', justifyContent: 'center', padding: '12px' }}>
          Другой email
        </button>
      </AuthShell>
    );
  }

  return (
    <AuthShell icon={Icons.mail} title="Вход в ClickVPN" subtitle="Введите email — пришлём ссылку для входа.">
      <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <TextField icon={Icons.mail} type="email" placeholder="email@example.com"
          value={email} onChange={setEmail} autoFocus autoComplete="email" />
        <ErrorMsg>{error}</ErrorMsg>
        <button type="submit" disabled={loading || !email}
          style={{ ...appStyles.btnPrimary, justifyContent: 'center', padding: '14px 20px', fontSize: 15, borderRadius: 12, marginTop: 4, opacity: (loading || !email) ? 0.5 : 1 }}>
          {loading ? <Spinner /> : 'Получить ссылку'}
        </button>
      </form>
      <div style={{ fontSize: 12, color: 'var(--text3)', textAlign: 'center', marginTop: 16, lineHeight: 1.5 }}>
        Без паролей. Каждый вход — одноразовая ссылка на ваш email.
      </div>
    </AuthShell>
  );
}

function loadFontOnce(family) {
  const id = 'gf-' + family.replace(/[^a-z0-9]/gi, '');
  if (document.getElementById(id)) return;
  const link = document.createElement('link');
  link.id = id; link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${family}&display=swap`;
  document.head.appendChild(link);
}

function applyCabFont(f) {
  loadFontOnce(f.import);
  const r = document.documentElement;
  r.style.setProperty('--cab-font', f.font);
  r.style.setProperty('--cab-display', f.display);
}

function applyPalette(p) {
  const r = document.documentElement;
  r.style.setProperty('--accent',       p.accent);
  r.style.setProperty('--accent-hi',    p.hi);
  r.style.setProperty('--accent-lo',    p.lo);
  r.style.setProperty('--accent-glow',  p.glow);
}


function useStyleSettings() {
  const palette = PALETTES.find(p => p.id === 'mono') || PALETTES[0];
  const headline = HEADLINES.find(h => h.id === 'free') || HEADLINES[0];
  const cab = CAB_FONTS.find(f => f.id === 'inter') || CAB_FONTS[0];
  useEffect(() => { applyPalette(palette); applyCabFont(cab); }, []);
  return { palette, headline, cab };
}

function computeDaysLeft(iso) {
  if (!iso) return 0;
  const ms = new Date(iso).getTime() - Date.now();
  if (isNaN(ms) || ms <= 0) return 0;
  return Math.ceil(ms / (1000 * 60 * 60 * 24));
}

function pluralDays(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'день';
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'дня';
  return 'дней';
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

function formatBytes(n) {
  if (!n || n <= 0) return '0 ГБ';
  const gb = n / (1024 ** 3);
  if (gb < 0.1) return (n / (1024 ** 2)).toFixed(1) + ' МБ';
  return gb.toFixed(gb < 10 ? 2 : 1) + ' ГБ';
}

function TelegramLinkBanner() {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  const handleLink = async () => {
    setError('');
    setBusy(true);
    try {
      const data = await api('/api/telegram/link/start', { method: 'POST' });
      if (data.deeplink_url) window.open(data.deeplink_url, '_blank', 'noopener');
    } catch (err) {
      setError(err.message || 'Не удалось запустить привязку');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ padding: '16px 20px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 14, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16 }}>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 2 }}>Привязать Telegram</div>
        <div style={{ fontSize: 13, color: 'var(--text2)' }}>
          Если у вас уже есть подписка в нашем боте — она перенесётся в этот аккаунт.
        </div>
        {error && <div style={{ fontSize: 12, color: 'var(--red)', marginTop: 4 }}>{error}</div>}

      <button onClick={handleLink} disabled={busy} style={{ ...appStyles.btnPrimary, padding: '8px 16px', fontSize: 13, flexShrink: 0 }}>

      </button>
    </div>
  );
}

function providerLabel(p) {

}

function DevicesTab({ primary }) {
  const [devices, setDevices] = useState(null);
  const [error, setError] = useState('');
  const [removing, setRemoving] = useState(null);

  const deviceLimit = primary?.device_limit;
  const uuid = primary?.uuid;

  const load = async () => {
    if (!uuid) { setDevices([]); return; }
    setError('');
    try {
      const data = await api(`/api/devices?uuid=${encodeURIComponent(uuid)}`);
      setDevices(data.devices || []);
    } catch (err) {
      setError('Не удалось загрузить устройства');
      setDevices([]);
    }
  };

  useEffect(() => { load(); }, [uuid]);

  const handleUnbind = async (hwid) => {
    if (!confirm('Отвязать это устройство? Оно перестанет подключаться к VPN.')) return;
    setRemoving(hwid);
    try {
      await api('/api/devices/delete', { method: 'POST', body: JSON.stringify({ hwid, uuid }) });
      await load();
    } catch (err) {
      setError('Не удалось отвязать устройство');
    } finally {
      setRemoving(null);
    }
  };

  if (!primary) {
    return (
      <div style={{ padding: '40px', textAlign: 'center', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 14, color: 'var(--text2)' }}>
        Сначала купите подписку — после этого здесь можно будет управлять устройствами.
      </div>
    );
  }

  if (devices === null) {
    return <div style={{ padding: 40, textAlign: 'center', color: 'var(--text3)' }}><Spinner /></div>;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ fontSize: 14, color: 'var(--text2)' }}>
          Подключено: <strong style={{ color: 'var(--text)' }}>{devices.length}</strong>
          {deviceLimit ? <> из <strong style={{ color: 'var(--text)' }}>{deviceLimit}</strong></> : null}
        </div>
        <button onClick={load} style={{ ...appStyles.btnGhost }}>Обновить</button>
      </div>

      {error && (
        <div style={{ padding: '10px 14px', borderRadius: 8, background: 'oklch(60% 0.2 25 / 0.1)', border: '1px solid oklch(60% 0.2 25 / 0.3)', color: 'var(--red)', fontSize: 13 }}>
          {error}
        </div>
      )}

      {devices.length === 0 ? (
        <div style={{ padding: '40px', textAlign: 'center', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 14 }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>📱</div>
          <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 6 }}>Нет подключённых устройств</div>
          <div style={{ fontSize: 14, color: 'var(--text2)' }}>Установи VPN-приложение и подключись через свою ссылку — устройство появится здесь.</div>
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {devices.map(d => {
            const title = d.deviceModel || d.platform || 'Устройство';
            const subParts = [];
            if (d.platform && d.platform !== title) subParts.push(d.platform);
            if (d.osVersion) subParts.push(d.osVersion);
            const sub = subParts.join(' · ');
            return (
              <div key={d.hwid} style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '14px 18px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 12 }}>
                <div style={{ width: 36, height: 36, borderRadius: 10, background: 'var(--surface2)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--accent)', flexShrink: 0 }}>
                  <Icon d={Icons.wifi} size={16} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{title}</div>
                  <div style={{ fontSize: 12, color: 'var(--text3)', fontFamily: 'var(--mono)', marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {sub || d.hwid.slice(0, 16)}
                  </div>
                </div>
                <div style={{ fontSize: 12, color: 'var(--text3)', flexShrink: 0 }}>{formatDate(d.createdAt)}</div>
                <button onClick={() => handleUnbind(d.hwid)} disabled={removing === d.hwid}
                  style={{ ...appStyles.btnGhost, color: 'var(--red)', border: '1px solid oklch(60% 0.2 25 / 0.3)', borderRadius: 8, padding: '6px 12px', fontSize: 13, opacity: removing === d.hwid ? 0.5 : 1 }}>
                  {removing === d.hwid ? '...' : 'Отвязать'}
                </button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function TelegramRow({ linked, isLast }) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  const handleLink = async () => {
    setError('');
    setBusy(true);
    try {
      const data = await api('/api/telegram/link/start', { method: 'POST' });
      if (data.deeplink_url) window.open(data.deeplink_url, '_blank', 'noopener');
    } catch (err) {
      setError(err.message || 'Не удалось запустить привязку');
    } finally {
      setBusy(false);
    }
  };

  const handleUnlink = async () => {
    if (!confirm('Отвязать Telegram от этого аккаунта?')) return;
    setBusy(true);
    try {
      await api('/api/telegram/unlink', { method: 'POST' });
      window.location.reload();
    } catch (err) {
      setError(err.message || 'Не удалось отвязать');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, padding: '14px 0', borderBottom: isLast ? 'none' : '1px solid var(--border)' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16 }}>
        <div style={{ color: 'var(--text2)', fontSize: 14 }}>Telegram</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          {linked ? (
            <>
              <span style={{ fontSize: 14, color: 'var(--green)', fontWeight: 600 }}>✓ Привязан</span>
              <button onClick={handleUnlink} disabled={busy} style={{ ...appStyles.btnGhost, padding: '6px 12px', border: '1px solid var(--border2)', borderRadius: 8, fontSize: 13, color: 'var(--text2)' }}>
                {busy ? <Spinner /> : 'Отвязать'}
              </button>
            </>
          ) : (
            <button onClick={handleLink} disabled={busy} style={{ ...appStyles.btnPrimary, padding: '6px 14px', fontSize: 13 }}>
              {busy ? <Spinner /> : 'Привязать'}
            </button>
          )}
        </div>
      </div>
      {error && <div style={{ fontSize: 12, color: 'var(--red)' }}>{error}</div>}
    </div>
  );
}

function ProfileRow({ label, value, copyable, isLast }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = () => {
    if (!copyable) return;
    navigator.clipboard.writeText(value).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 0', borderBottom: isLast ? 'none' : '1px solid var(--border)', gap: 16 }}>
      <div style={{ color: 'var(--text2)', fontSize: 14 }}>{label}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
        <span style={{ fontFamily: 'var(--mono)', fontSize: 14, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{value}</span>
        {copyable && (
          <button onClick={handleCopy} title="Скопировать"
            style={{ background: 'transparent', border: '1px solid var(--border2)', borderRadius: 6, padding: '4px 6px', cursor: 'pointer', color: copied ? 'var(--green)' : 'var(--text2)', flexShrink: 0 }}>
            <Icon d={copied ? Icons.checkCircle : Icons.copy} size={13} />
          </button>
        )}
      </div>
    </div>
  );
}

function SettingRow({ label, desc, children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '18px 20px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 12, gap: 24 }}>
      <div>
        <div style={{ fontWeight: 500, marginBottom: 2 }}>{label}</div>
        <div style={{ fontSize: 13, color: 'var(--text2)' }}>{desc}</div>
      </div>
      {children}
    </div>
  );
}

function Spinner() {
  return (
    <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
      {[0,1,2].map(i => (
        <div key={i} style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--accent-text)', animation: `dotPulse 1.2s ease-in-out ${i * 0.2}s infinite` }} />
      ))}
    </div>
  );
}

const PAY_METHODS = [
  { id: 'platega_card', label: 'Банковская карта',  hint: 'РФ карты, мгновенно' },
  { id: 'platega_sbp',  label: 'СБП',               hint: 'Сбер/Тинькофф/любой банк' },
  { id: 'heleket',      label: 'Криптовалюта',      hint: 'USDT / TON / BTC' },
];

function PaymentModal({ months, amountRub, onClose, onSuccess }) {
  const [submitting, setSubmitting] = useState(null);
  const [error, setError] = useState('');

  const submit = async (provider) => {
    setError('');
    setSubmitting(provider);
    try {
      const data = await api('/api/subscription/buy', {
        method: 'POST',
        body: JSON.stringify({ months, provider }),
      });
      if (data.pay_url) {
        window.location.href = data.pay_url;
      } else if (data.ok) {
        await onSuccess?.();
      }
    } catch (err) {
      setError(err.message || 'Ошибка платежа');
      setSubmitting(null);
    }
  };

  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 20 }}>
      <div onClick={e => e.stopPropagation()} style={{ width: '100%', maxWidth: 460, background: 'var(--surface)', border: '1px solid var(--border2)', borderRadius: 20, padding: 28, animation: 'fadeUp 0.3s ease forwards' }}>
        <div style={{ fontSize: 12, fontFamily: 'var(--mono)', color: 'var(--text3)', letterSpacing: '0.15em', marginBottom: 8 }}>
          ОПЛАТА ПОДПИСКИ
        </div>
        <h2 style={{ fontSize: 24, fontWeight: 700, fontFamily: 'var(--display)', marginBottom: 20 }}>
          Подписка на {months} {months === 1 ? 'месяц' : months < 5 ? 'месяца' : 'месяцев'}
        </h2>

        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 24 }}>
          <span style={{ fontSize: 36, fontWeight: 800, fontFamily: 'var(--display)' }}>{amountRub.toLocaleString('ru')}</span>
          <span style={{ fontSize: 18, color: 'var(--text2)' }}>₽</span>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 16 }}>
          {PAY_METHODS.map(m => (
            <button key={m.id} onClick={() => submit(m.id)} disabled={submitting !== null}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 18px', background: 'var(--bg2)', border: '1px solid var(--border2)', borderRadius: 12, color: 'var(--text)', cursor: 'pointer', fontFamily: 'var(--font)', fontSize: 15, fontWeight: 500, opacity: submitting && submitting !== m.id ? 0.4 : 1, transition: 'all 0.15s' }}
              onMouseEnter={e => { if (!submitting) e.currentTarget.style.borderColor = 'var(--accent)'; }}
              onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--border2)'}>
              <div style={{ textAlign: 'left' }}>
                <div>{m.label}</div>
                <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>{m.hint}</div>
              </div>
              {submitting === m.id ? <Spinner /> : <Icon d={Icons.arrowRight} size={16} stroke="var(--text3)" />}
            </button>
          ))}
        </div>

        {error && (
          <div style={{ padding: '10px 14px', borderRadius: 8, background: 'oklch(60% 0.2 25 / 0.1)', border: '1px solid oklch(60% 0.2 25 / 0.3)', color: 'var(--red)', fontSize: 13, marginBottom: 12 }}>
            {error}
          </div>
        )}

        <button onClick={onClose} style={{ width: '100%', padding: '12px', background: 'transparent', border: 'none', color: 'var(--text2)', cursor: 'pointer', fontSize: 14, fontFamily: 'var(--font)' }}>
          Отмена
        </button>
      </div>
    </div>
  );
}

function App() {
  const initialUrl = new URL(window.location.href);
  const initialPath = initialUrl.pathname;
  const initialToken = initialUrl.searchParams.get('token') || '';

  const PAGE_TO_PATH = {
    'pricing': '/',
    'auth': '/auth',
    'cabinet': '/cabinet',
  };
  const PATH_TO_PAGE = {
    '/': 'pricing',
    '/auth': 'auth',
    '/cabinet': 'cabinet',
  };

  const firstPage = PATH_TO_PAGE[initialPath] || 'pricing';

  const [page, setPage] = useState(firstPage);
  const [token, setToken] = useState(initialToken);
  const [user, setUser] = useState(null);
  const [bootstrapping, setBootstrapping] = useState(true);

  const navigate = (p) => {
    const nextPath = PAGE_TO_PATH[p] || '/';
    const cur = window.location.pathname + window.location.search;
    if (cur !== nextPath) window.history.pushState({ page: p }, '', nextPath);
    setPage(p);
  };

  useEffect(() => {
    const onPop = () => {
      const path = window.location.pathname;
      const newPage = PATH_TO_PAGE[path] || 'pricing';
      const newToken = new URL(window.location.href).searchParams.get('token') || '';
      setToken(newToken);
      setPage(newPage);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const refreshUser = async () => {
    try {
      const data = await api('/api/me');
      setUser(data);
      return data;
    } catch {
      setUser(null);
      return null;
    }
  };

  useEffect(() => {
    refreshUser()
      .then(data => {
        if (data && firstPage === 'pricing') {
          window.history.replaceState({ page: 'cabinet' }, '', '/cabinet');
          setPage('cabinet');
        }
      })
      .finally(() => setBootstrapping(false));
  }, []);

  const handleLogin = async () => {
    const data = await refreshUser();
    if (data) navigate('cabinet');
    else navigate('login');
  };

  const handleLogout = async () => {
    try { await api('/api/logout', { method: 'POST' }); } catch {}
    setUser(null);
    navigate('pricing');
  };

  if (bootstrapping) {
    return (
      <div style={{ ...appStyles.container, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <Spinner />
      </div>
    );
  }

  return (
    <div style={appStyles.container}>
      <Navbar page={page} setPage={navigate} user={user} onLogout={handleLogout} />
      {page === 'auth'     && <AuthPage token={token} onSuccess={handleLogin} setPage={navigate} />}
      {page === 'pricing'  && <PricingPage setPage={navigate} user={user} refreshUser={refreshUser} />}
      {page === 'cabinet'  && user && <CabinetPage user={user} setPage={navigate} refreshUser={refreshUser} />}
      {page === 'cabinet'  && !user && <AuthPage token={token} onSuccess={handleLogin} setPage={navigate} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
